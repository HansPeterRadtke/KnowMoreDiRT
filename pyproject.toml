[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "knowmoredirt"
version = "0.1.0"
description = "Test-first raw-folder foundation for KnowMoreDiRT."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "KnowMoreDiRT contributors" }]
dependencies = ["numpy>=1.24", "Pillow>=9.4", "PyYAML>=6.0", "pyarrow==25.0.0", "jsonschema>=4.18"]

[project.scripts]
kmd-filesystem = "file_system_catalog.folder_assistant_cli:main"
kmd-filesystem-search = "file_system_catalog.content_search_cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
py-modules = ["context_capacity", "kmd_runtime_config", "kmd_model_call_cache"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"


[tool.setuptools.package-data]
knowmoredirt = ["default_config.xml"]
